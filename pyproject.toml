[project]
name = "flu-epidemic-intelligence"
version = "0.1.0"
description = "Content-aware flu outbreak detection: GDELT content signal vs WHO FluNet/UKHSA ground truth"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "freezegun>=1.5",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: pure-logic tests, no network",
    "integration: tests that touch a real network/API",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
